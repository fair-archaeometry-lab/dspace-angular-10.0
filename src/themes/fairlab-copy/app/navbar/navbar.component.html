@if ((isMobile$ | async) && (isAuthenticated$ | async)) {
  <ds-user-menu [inExpandableNavbar]="true"></ds-user-menu>
}

<div class="navbar-nav flex-shrink-1 h-100 align-items-md-stretch gapx-3" role="menubar" id="main-site-navigation" [ngClass]="(isMobile$ | async) ? 'navbar-nav-mobile' : 'navbar-nav-desktop'">
  <!-- Existing dynamic sections (remain first) -->
  @for (section of (sections | async); track section) {
    <ng-container
      *ngComponentOutlet="(sectionMap$ | async).get(section.id)?.component; injector: (sectionMap$ | async).get(section.id)?.injector;">
    </ng-container>
  }

  <!-- Your external link (now last) -->
  <div class="nav-item d-flex align-items-center ms-md-2">  <!-- ms-md-2 adds left margin on desktop -->
    <a class="ds-menu-item" 
       href="https://www.bergbaumuseum.de/" 
       target="_blank"
       rel="noopener noreferrer"
       [attr.aria-label]="'navbar.link.museum' | translate">
       <!--<i class="fas fa-external-link-alt me-1"></i> optional icon--> 
      {{ 'navbar.link.museum' | translate }}
    </a>
  </div>
  <div class="nav-item d-flex align-items-center ms-md-2">  <!-- add the new item about here -->
    <a class="ds-menu-item" routerLink="/info/about">
        {{ 'menu.header.about' | translate }}
    </a>
  </div>
</div>
